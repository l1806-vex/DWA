<text x="46" y="21.0" fill="#9a9aa3" font-size="11.5" letter-spacing="0.4">dwa - demo</text>
<text class="l0" x="22" y="52" fill="#5ee08a">$ ./dwa.exe</text>
<text class="l1" x="22" y="74" fill="#e4e4e7"></text>
<text class="l2" x="22" y="96" fill="#82a4ff">DWA - DeepSeek Web API</text>
<text class="l3" x="22" y="118" fill="#8a8a93">OpenAI:    http://127.0.0.1:8000/v1/chat/completions</text>
<text class="l4" x="22" y="140" fill="#8a8a93">Anthropic: http://127.0.0.1:8000/v1/messages</text>
<text class="l5" x="22" y="162" fill="#8a8a93">Models:    http://127.0.0.1:8000/v1/models</text>
<text class="l6" x="22" y="184" fill="#e4e4e7"></text>
<text class="l7" x="22" y="206" fill="#5ee08a">$ curl :8000/v1/chat/completions \</text>
<text class="l8" x="22" y="228" fill="#e4e4e7">    -d &#x27;{&quot;model&quot;:&quot;deepseek-chat&quot;,&quot;messages&quot;:</text>
<text class="l9" x="22" y="250" fill="#e4e4e7">         [{&quot;role&quot;:&quot;user&quot;,&quot;content&quot;:&quot;Say hi in one word&quot;}]}&#x27;</text>
<text class="l10" x="22" y="272" fill="#e4e4e7"></text>
<text class="l11" x="22" y="294" fill="#8a8a93">{</text>
<text class="l12" x="22" y="316" fill="#8a8a93">  &quot;object&quot;: &quot;chat.completion&quot;, &quot;model&quot;: &quot;deepseek-chat&quot;,</text>
<text class="l13" x="22" y="338" fill="#8a8a93">  &quot;choices&quot;: [{ &quot;message&quot;: { &quot;role&quot;: &quot;assistant&quot;,</text>
<text class="l14" x="22" y="360" fill="#7ee0a8">                              &quot;content&quot;: &quot;Hi&quot; },</text>
<text class="l15" x="22" y="382" fill="#8a8a93">                 &quot;finish_reason&quot;: &quot;stop&quot; }]</text>
<text class="l16" x="22" y="404" fill="#8a8a93">}</text>
<text class="l17" x="22" y="426" fill="#e4e4e7"></text>
<text class="l18" x="22" y="448" fill="#5ee08a">$ curl :8000/v1/messages \</text>
<text class="l19" x="22" y="470" fill="#e4e4e7">    -d &#x27;{&quot;model&quot;:&quot;deepseek-chat&quot;,&quot;max_tokens&quot;:100,&quot;messages&quot;:</text>
<text class="l20" x="22" y="492" fill="#e4e4e7">         [{&quot;role&quot;:&quot;user&quot;,&quot;content&quot;:&quot;Say hello in one word&quot;}]}&#x27;</text>
<text class="l21" x="22" y="514" fill="#e4e4e7"></text>
<text class="l22" x="22" y="536" fill="#8a8a93">{</text>
<text class="l23" x="22" y="558" fill="#8a8a93">  &quot;type&quot;: &quot;message&quot;, &quot;role&quot;: &quot;assistant&quot;,</text>
<text class="l24" x="22" y="580" fill="#7ee0a8">  &quot;content&quot;: [{ &quot;type&quot;: &quot;text&quot;, &quot;text&quot;: &quot;Hello&quot; }],</text>
<text class="l25" x="22" y="602" fill="#8a8a93">  &quot;stop_reason&quot;: &quot;end_turn&quot;</text>
